- name: Home
  width: wide
  # head-widgets:
  #   - type: search
  #     search-engine: kagi
  #     placeholder: Search with Kagi...
  #     new-tab: true
  #     autofocus: false
  #     bangs:
  #       - title: YouTube
  #         shortcut: "!yt"
  #         url: https://www.youtube.com/results?search_query={QUERY}
  #         new-tab: true

  columns:
    - size: full
      widgets:
        - type: group
          title: Services
          widgets:
            - type: docker-containers
              title: Docker
              hide-by-default: true
              containers:
                komodo-core-core-1:
                  name: Komodo
                  description: Docker Stack Manager
                  url: ${KOMODO_EXT_URL}
                  icon: di:komodo
                  hide: false
                birdnet-go:
                  name: BirdNET
                  description: Bird Song Identification
                  url: ${BIRDNET_EXT_URL}
                  icon: di:birdnet.png
                  hide: false
                readeck:
                  name: Readeck
                  description: Read-It-Later
                  url: ${READECK_EXT_URL}
                  icon: di:readeck
                  hide: false
                wud:
                  name: What's Up Docker?
                  description: Docker Image Updates
                  url: ${WUD_EXT_URL}
                  icon: di:whats-up-docker
                  hide: false
                dozzle-server-dozzle-1:
                  name: Dozzle
                  description: Docker Log Viewer
                  url: ${DOZZLE_EXT_URL}
                  icon: di:dozzle
                  hide: false

            - type: monitor
              cache: 1m
              title: VM
              sites:
                - title: Home Assistant
                  url: ${HOMEASSISTANT_EXT_URL}
                  check-url: ${HOMEASSISTANT_TS_URL}
                  icon: di:home-assistant

        - type: group
          widgets:
            - type: reddit
              subreddit: selfhosted
              collapse-after: 7
            - type: reddit
              subreddit: homelab
              collapse-after: 7

    - size: small
      widgets:
        - type: bookmarks
          groups:
            - title: Work
              links:
                - title: GitHub Project
                  url: ${GITHUB_PROJECT_URL}
                  icon: di:github-light.svg
                - title: Harvest
                  url: ${HARVEST_URL}
                  icon: di:bitcoin.svg
                - title: Quickbooks
                  url: ${QUICKBOOKS_URL}
                  icon: si:quickbooks

            - title: Tools
              links:
                - title: Kagi Assistant
                  url: https://kagi.com/assistant
                  icon: di:kagi.svg
                - title: IT Tools
                  url: https://it-tools.tech/
                  icon: di:it-tools-light.svg
                - title: Selfh.st
                  url: https://selfh.st/
                  icon: di:selfh-st.svg

            - title: Entertainment
              links:
                - title: YouTube
                  url: https://www.youtube.com/
                  icon: si:youtube.svg
                - title: Reddit
                  url: https://old.reddit.com/
                  icon: si:reddit.svg
                - title: Twitch
                  url: https://www.twitch.tv/
                  icon: si:twitch.png

    - size: small
      widgets:
          # if you have 2 or more servers you can modify the "if eq $name" part, add the name of the servers and url. Otherwise remove this part and replace by the default template of this widget
        - type: custom-api
          title: Beszel Stats
          url: ${BESZEL_TS_URL}/api/collections/systems/records
          method: GET
          options:
            in-new-tab: true
            hide-ip: true
          headers:
            Authorization: Bearer ${BESZEL_TOKEN}
            Accept: application/json
          template: |
            {{ $redirect := .Options.StringOr "redirect-url" "" }}
            {{ $newTab := .Options.BoolOr "in-new-tab" false }}
            {{ $hideKernel := .Options.BoolOr "hide-kernel" false }}
            {{ $hideUptime := .Options.BoolOr "hide-uptime" false }}
            {{ $hideCPUInfo := .Options.BoolOr "hide-cpu-info" false }}
            {{ $hideIP := .Options.BoolOr "hide-ip" false }}
            {{ $collapsible := .Options.BoolOr "collapsible" false }}
            {{ $items := .JSON.Array "items" }}
            {{ range $items }}
              {{ $info := .Get "info" }}
              {{ $name := .String "name" }}
              {{ $redirect := "" }}
              {{ if eq $name "thor" }}
                {{ $redirect = "${BESZEL_EXT_URL}" }}
              {{ else if eq $name "loki" }}
                {{ $redirect = "${BESZEL_EXT_URL}" }}
              {{ end }}
              <div style="margin-bottom: 2em;">
              {{ $link := "" }}
              {{ if ne $redirect "" }}
                {{ $link = printf "%s/system/%s" $redirect $name }}
              {{ end }}
              <div style="font-size: 1.15em; margin-bottom: 1em;">
                {{ if eq (.String "status") "up" }}
                  <span class="status-dot color-positive">●</span>
                {{ else }}
                  <span class="status-dot color-negative">●</span>
                {{ end }}
                {{ if ne $redirect "" }}
                  <a class="color-highlight text-truncate" href="{{ printf "%s/system/%s" $redirect $name | safeURL }}" {{ if $newTab }}target="_blank" rel="noopener"{{ end }}>
                    {{ $name }}{{ if not $hideIP }} ({{ .String "host" }}){{ end }}
                  </a>
                {{ else }}
                  <span class="color-highlight text-truncate">
                    {{ $name }}{{ if not $hideIP }} ({{ .String "host" }}){{ end }}
                  </span>
                {{ end }}
              </div>

              {{ if $collapsible }}
                <details class="margin-top-5">
                  <summary class="size-h5 color-subtle" style="cursor: pointer;">Metrics</summary>
                  <div class="margin-top-5">
                    {{ if not $hideKernel }}
                      <p style="font-size: 1em;">Kernel: {{ $info.String "k" }}</p>
                    {{ end }}
                    {{ if not $hideUptime }}
                      {{ $uptimeSec := $info.Float "u" }}
                      {{ if ge $uptimeSec 86400.0 }}
                        <p style="font-size: 1em;">Uptime: {{ printf "%.2f" (mul $uptimeSec 0.000011574) }}d</p>
                      {{ else }}
                        <p style="font-size: 1em;">Uptime: {{ printf "%.2f" (mul $uptimeSec 0.000277778) }}h</p>
                      {{ end }}
                    {{ end }}
                    {{ if not $hideCPUInfo }}
                      <p style="font-size: 1em;">CPU: {{ replaceAll "CPU " "" ($info.String "m") }}</p>
                    {{ end }}
                    <p style="font-size: 1em; margin-top: 0.5em;">📊 Cpu: {{ $info.Float "cpu" }}%</p>
                    <p style="font-size: 1em;">🧠 Memory: {{ $info.Float "mp" }}%</p>
                    <p style="font-size: 1em;">💾 Disk: {{ $info.Float "dp" }}%</p>
                  </div>
                </details>

              {{ else }}
                <div class="margin-top-5">
                  {{ if not $hideKernel }}
                    <p style="font-size: 1em;">Kernel: {{ $info.String "k" }}</p>
                  {{ end }}
                  {{ if not $hideUptime }}
                    {{ $uptimeSec := $info.Float "u" }}
                    {{ if ge $uptimeSec 86400.0 }}
                      <p style="font-size: 1em;">Uptime: {{ printf "%.2f" (mul $uptimeSec 0.000011574) }}d</p>
                    {{ else }}
                      <p style="font-size: 1em;">Uptime: {{ printf "%.2f" (mul $uptimeSec 0.000277778) }}h</p>
                    {{ end }}
                  {{ end }}
                  {{ if not $hideCPUInfo }}
                    <p style="font-size: 1em;">CPU: {{ replaceAll "CPU " "" ($info.String "m") }}</p>
                  {{ end }}
                  <p style="font-size: 1em; margin-top: 0.5em;">📊 Cpu: {{ $info.Float "cpu" }}%</p>
                  <p style="font-size: 1em;">🧠 Memory: {{ $info.Float "mp" }}%</p>
                  <p style="font-size: 1em;">💾 Disk: {{ $info.Float "dp" }}%</p>
                </div>
              {{ end }}
              </div>
            {{ end }}

        - type: custom-api
          title: What's Up Docker?
          cache: 1h
          url: ${WUD_TS_URL}/api/containers/
          method: GET
          template: |
            {{/* You are using WUD Monitor v2.0*/}}
            <style>
              .vertical-separator {
                width: 3px;
                height: 3.5rem;
                margin: 0 1rem;
                border-radius: 2px;
                align-self: center;
                background: linear-gradient(
                  to bottom,
                  transparent,
                  rgba(255, 255, 255, 0.05) 20%,
                  rgba(255, 255, 255, 0.05) 80%,
                  transparent
                );
              }

              .container-info {
                display: flex;
                align-items: flex-start;
                justify-content: space-evenly;
                margin: 1rem 0;
                width: 100%;
              }

              .info-column {
                display: flex;
                flex-direction: column;
                align-items: center;
                min-width: 4rem;
              }

              .info-label {
                font-size: 1.20rem;
                opacity: 0.9;
                text-align: center;
              }

              .info-value {
                font-size: 1.4rem;
                margin-top: 0.25rem;
                text-align: center;
              }

              .info-count {
                font-size: 1.45rem !important;
              }

              /* Container Size: Full */
              @container widget (min-width: 550px) {
                .container-info {
                  justify-content: flex-start;
                  gap: 2rem;
                  padding: 0.5rem;
                }

                .vertical-separator {
                  align-self: flex-start;
                  margin: 0 2rem;
                }

                .info-column {
                  align-items: flex-start;
                }

                .info-label .info-value {
                  text-align: left;
                }
              }
            </style>

            {{/* ======================= MENU ======================= */}}
            {{ $showInfo := false }}        {{/* Show the overall info summary (Updates, Total, Running) */}}
            {{ $showList := true }}         {{/* Show the container list section */}}
            {{ $showAll := false }}         {{/* Show all containers (not just ones with updates) */}}
            {{ $showUpdateKind := false }}  {{/* Toggle this to false to hide the Update Kind row */}}
            {{ $showUpdateTypes := false }} {{/* Toggle this to false to hide the Update Types breakdown */}}
            {{ $showLocalVersion := false }} {{/* Toggle this to true to show local version instead of update status */}}
            {{ $hasUpdates := false }}      {{/* Set this to true to hide up-to-date message */}}

            {{ $containers := .JSON.Array "" }}
            {{ $total := len $containers }}
            {{ $updates := 0 }}
            {{ $running := 0 }}

            {{ range $containers }}
              {{ if .Bool "updateAvailable" }}
                {{ $updates = add $updates 1 }}
              {{ end }}
              {{ if eq (.String "status") "running" }}
                {{ $running = add $running 1 }}
              {{ end }}
            {{ end }}

            {{ if $showInfo }}
              <div class="container-info">
                <div class="info-column">
                  <div class="info-label info-count">Updates</div>
                  <div class="info-value info-count">{{ $updates }}</div>
                </div>

                <div class="vertical-separator"></div>

                <div class="info-column">
                  <div class="info-label info-count">Total</div>
                  <div class="info-value info-count">{{ $total }}</div>
                </div>

                <div class="vertical-separator"></div>

                <div class="info-column">
                  <div class="info-label info-count">Running</div>
                  <div class="info-value info-count">{{ $running }}</div>
                </div>
              </div>
              {{ if $showUpdateTypes }}
              <div class="flex items-center text-center">
                {{ $majorCount := 0 }}
                {{ $minorCount := 0 }}
                {{ $patchCount := 0 }}
                {{ $unknownCount := 0 }}
                {{ range $containers }}
                  {{ if .Bool "updateAvailable" }}
                    {{ $kind := .String "updateKind.semverDiff" }}
                    {{ if eq $kind "major" }}
                      {{ $majorCount = add $majorCount 1 }}
                    {{ else if eq $kind "minor" }}
                      {{ $minorCount = add $minorCount 1 }}
                    {{ else if eq $kind "patch" }}
                      {{ $patchCount = add $patchCount 1 }}
                    {{ else }}
                      {{ $unknownCount = add $unknownCount 1 }}
                    {{ end }}
                  {{ end }}
                {{ end }}
                <div class="flex-1">
                  <div class="size-h3">{{ $majorCount }}</div>
                  <div class="size-h6">MAJOR</div>
                </div>
                <div class="vertical-separator" style="width: 2px; margin: 0 0.25rem;"></div>
                <div class="flex-1">
                  <div class="size-h3">{{ $minorCount }}</div>
                  <div class="size-h6">MINOR</div>
                </div>
                <div class="vertical-separator" style="width: 2px; margin: 0 0.25rem;"></div>
                <div class="flex-1">
                  <div class="size-h3">{{ $patchCount }}</div>
                  <div class="size-h6">PATCH</div>
                </div>
                <div class="vertical-separator" style="width: 2px; margin: 0 0.25rem;"></div>
                <div class="flex-1">
                  <div class="size-h3">{{ $unknownCount }}</div>
                  <div class="size-h6">UNKNOWN</div>
                </div>
              </div>
              {{ end }}
            {{ end }}

            {{ if $showList }}
              <div style="height: 10px;"></div>
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                {{ range $index, $container := $containers }}
                  {{ if $container.Bool "updateAvailable" }}
                    {{ $hasUpdates = true }}
                    <li>
                      <div class="flex flex-column">
                        {{ $registryName := $container.String "image.registry.name" }}
                        {{ $imageName := $container.String "image.name" }}
                        {{ $hubSource := "#" }}
                        {{ if eq $registryName "hub.public" }}
                          {{ $hubSource = concat "https://hub.docker.com/r/" $imageName }}
                        {{ else if eq $registryName "ghcr.public" }}
                          {{ $hubSource = concat "https://github.com/" $imageName }}
                        {{ end }}

                        <div class="size-h4">
                          {{ if eq ($container.String "status") "running" }}
                            <span class="status-dot color-positive">●</span>
                          {{ else }}
                            <span class="status-dot color-negative">●</span>
                          {{ end }}
                          <a class="color-highlight text-truncate" href="{{ $hubSource }}" target="_blank" rel="noreferrer">{{ $container.String "name" }}</a>
                        </div>

                        <div class="container-info">
                          <div class="info-column">
                            <div class="info-label">Watcher</div>
                            <div class="info-value">{{ $container.String "watcher" }}</div>
                          </div>

                          <div class="vertical-separator"></div>

                          {{ if $showLocalVersion }}
                            <div class="info-column">
                              <div class="info-label">Version</div>
                              <div class="info-value">
                          {{ $localValue := $container.String "updateKind.localValue" }}
                          {{ if ge (len $localValue) 7 }}
                            {{ $isSha256 := eq (slice $localValue 0 7) "sha256:" }}
                            {{ if $isSha256 }}
                              {{ $shortDigest := slice $localValue 7 11 }}
                              <span>dig: {{ $shortDigest }}</span>
                            {{ else }}
                              <span>{{ $localValue }}</span>
                            {{ end }}
                            {{ else }}
                              <span>{{ $localValue }}</span>
                            {{ end }}
                              </div>
                            </div>
                          {{ else }}
                            <div class="info-column">
                              <div class="info-label">Update</div>
                              <div class="info-value">
                                <span class="color-positive">Available</span>
                              </div>
                            </div>
                          {{ end }}
                          {{ if $showUpdateKind }}
                            <div class="vertical-separator"></div>
                            {{ $updateKind := $container.String "updateKind.semverDiff" }}
                            {{ if eq $updateKind "" }}
                              {{ $updateKind = "Unknown" }}
                            {{ end }}
                            {{ $tagValue := $container.String "updateKind.remoteValue" }}
                            {{ if eq $tagValue "" }}
                              {{ $tagValue = "Unknown" }}
                            {{ end }}
                            <div class="info-column">
                              <div class="info-label">{{ $updateKind }}</div>
                              <div class="info-value">
                                {{ if ge (len $tagValue) 7 }}
                                  {{ $isSha256 := eq (slice $tagValue 0 7) "sha256:" }}
                                  {{ if $isSha256 }}
                                    {{ $shortDigest := slice $tagValue 7 11 }}
                                    <span>dig: {{ $shortDigest }}</span>
                                  {{ else }}
                                    <span>{{ $tagValue }}</span>
                                  {{ end }}
                                  {{ else }}
                                    <span>{{ $tagValue }}</span>
                                  {{ end }}
                              </div>
                            </div>
                          {{ end }}
                        </div>
                      </div>
                    </li>
                  {{ end }}
                {{ end }}

                {{ if not $hasUpdates }}
                  <li class="flex items-center justify-center">
                    <span class="color-positive size-h4">All containers are up to date!</span>
                  </li>
                {{ end }}

                {{ if $showAll }}
                  {{ range $index, $container := $containers }}
                    {{ if not ($container.Bool "updateAvailable") }}
                      <li>
                        <div class="flex flex-column">
                          {{ $registryName := $container.String "image.registry.name" }}
                          {{ $imageName := $container.String "image.name" }}
                          {{ $hubSource := "#" }}
                          {{ if eq $registryName "hub.public" }}
                            {{ $hubSource = concat "https://hub.docker.com/r/" $imageName }}
                          {{ else if eq $registryName "ghcr.public" }}
                            {{ $hubSource = concat "https://github.com/" $imageName }}
                          {{ end }}

                          <div class="size-h4">
                            {{ if eq ($container.String "status") "running" }}
                              <span class="status-dot color-positive">●</span>
                            {{ else }}
                              <span class="status-dot color-negative">●</span>
                            {{ end }}
                            <a class="color-highlight text-truncate" href="{{ $hubSource }}" target="_blank" rel="noreferrer">{{ $container.String "name" }}</a>
                          </div>

                          <div class="container-info">
                            <div class="info-column">
                              <div class="info-label">Watcher</div>
                              <div class="info-value">{{ $container.String "watcher" }}</div>
                            </div>

                            <div class="vertical-separator"></div>

                            {{ if $showLocalVersion }}
                              <div class="info-column">
                                <div class="info-label">Version</div>
                                <div class="info-value">
                                  {{ $localValue := $container.String "updateKind.localValue" }}
                                  {{ if eq $localValue "" }}
                                    {{ $localValue = $container.String "updatekind.remoteValue" }}
                                    {{ if eq $localValue "" }}
                                      {{ $imageDigest := $container.String "image.digest.repo" }}
                                      {{ $isSha256 := eq (slice $imageDigest 0 7) "sha256:" }}
                                      {{ if $isSha256 }}
                                        {{ $shortDigest := slice $imageDigest 7 11 }}
                                        <span>dig: {{ $shortDigest }}</span>
                                      {{ else }}
                                        <span>-</span>
                                      {{ end }}
                                    {{ else }}
                                      <span>{{ $localValue }}</span>
                                    {{ end }}
                                  {{ else }}
                                    {{ $isSha256 := eq (slice $localValue 0 7) "sha256:" }}
                                    {{ if $isSha256 }}
                                      {{ $shortDigest := slice $localValue 7 11 }}
                                      <span>dig: {{ $shortDigest }}</span>
                                    {{ else }}
                                      <span>{{ $localValue }}</span>
                                    {{ end }}
                                  {{ end }}
                                </div>
                              </div>
                            {{ else }}
                              <div class="info-column">
                                <div class="info-label">Update</div>
                                <div class="info-value"><span class="color-negative">Not Found</span></div>
                              </div>
                            {{ end }}
                          </div>
                        </div>
                      </li>
                    {{ end }}
                  {{ end }}
                {{ end }}
              </ul>
            {{ end }}
