services:
  voyagers-of-nera:
    build: .
    restart: unless-stopped
    volumes:
      - "./dedicated-server:/dedicated-server"
      - "./saved:/dedicated-server/BoatGame/Saved"
      - "./config:/dedicated-server/BoatGame/Saved/PersistedData/CustomConfig"
    ports:
      - "0.0.0.0:7777:7777/udp"
      - "0.0.0.0:27015:27015/udp"