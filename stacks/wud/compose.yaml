services:
  whatsupdocker:
    image: getwud/wud:8.1
    container_name: wud
    environment:
      - WUD_REGISTRY_FORGEJO_CODEBERG_URL=https://codeberg.org
      - WUD_REGISTRY_FORGEJO_CODEBERG_LOGIN=""
      - WUD_REGISTRY_FORGEJO_CODEBERG_PASSWORD=""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3090:3000